[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-logic"
version = "0.3.0a0"
description = "Open-source 3D Finite Element Analysis (FEM) and 3D Topology Optimization engine and API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Topo_Logic Contributors" }]
keywords = ["fem", "finite-element-analysis", "topology-optimization", "cae", "stl", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pyamg>=5.2",
    "scikit-image>=0.24",
    "trimesh>=4.4",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
topopt = [
    "scikit-image>=0.24",
    "pyamg>=5.2",
    "scikit-fem>=10.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
topo-logic = "topo_logic.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
topo_logic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Pure unit tests without external server or slow meshes",
    "integration: API and persistence integration tests",
    "benchmark: Analytical FEM and topology optimization verification benchmarks",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["topo_logic", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["trimesh.*", "scipy.*", "pyamg.*", "skimage.*"]
ignore_missing_imports = true
